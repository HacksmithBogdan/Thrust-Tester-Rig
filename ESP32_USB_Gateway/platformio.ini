[platformio]
src_dir = main

[env:esp32-s3-lcd28b]
platform = espressif32@6.12.0
board = waveshare-lcd28b
framework = espidf
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    web/index.html
    web/styles.css
    web/app.js
    web/model.js
monitor_speed = 115200
upload_speed = 460800
