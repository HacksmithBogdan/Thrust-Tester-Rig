[platformio]
src_dir = main

[env:esp32-s3-zero]
platform = espressif32@6.12.0
board = esp32-s3-zero
framework = espidf
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles =
    web/index.html
    web/styles.css
    web/app.js
    web/model.js
monitor_speed = 115200
upload_speed = 460800
